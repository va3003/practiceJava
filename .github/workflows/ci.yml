# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Check WorkDir
      run: echo "Running script in subdir $(pwd)"
    - name: List files in current directory
      run: ls -la
    - name: List files in a specific subdirectory
      run: ls -la target/
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Check WorkDir
      run: echo "Running script in subdir $(pwd)"
    - name: deploy with maven
      run: mvn deploy:deploy-file -DpomFile=pom.xml -Dfile=/target/practiceJava-0.0.1-SNAPSHOT.jar -DrepositoryId=practiceJava -Durl=http://https://github.com/va3003/practiceJava

    
